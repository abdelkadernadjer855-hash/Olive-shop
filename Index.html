<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام إدارة محل الزيتون والمشتقات</title>
    <style>
        body { font-family: Tahoma, sans-serif; background: #f4f7f6; margin: 0; padding: 10px; color: #333; }
        .container { max-width: 1400px; margin: auto; background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        /* تنسيق الشعار والعنوان بشكل مدمج */
        .header-section { display: flex; align-items: center; justify-content: center; gap: 15px; margin-bottom: 15px; border-bottom: 2px solid #e8f5e9; padding-bottom: 10px; }
        .header-section img { width: 60px; height: auto; border-radius: 50%; border: 2px solid #2c5e1a; }
        h2 { margin: 0; color: #2c5e1a; font-size: 22px; }

        /* نظام الأعمدة لتكون الصفحة واحدة */
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        @media (max-width: 900px) { .dashboard-grid { grid-template-columns: 1fr; } }

        .card { background: #fafafa; border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px; margin-bottom: 15px; }
        h3 { margin-top: 0; color: #2c5e1a; font-size: 16px; border-bottom: 1px solid #ddd; padding-bottom: 5px; }

        .form-group { margin-bottom: 8px; }
        label { display: block; margin-bottom: 3px; font-weight: bold; font-size: 12px; }
        input, select { width: 100%; padding: 6px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; }
        
        button.action-btn { background: #2c5e1a; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; width: 100%; font-size: 14px; font-weight: bold; }
        button.action-btn:hover { background: #1e3f11; }
        
        table { width: 100%; margin-top: 10px; border-collapse: collapse; font-size: 12px; }
        th, td { border: 1px solid #ddd; padding: 6px; text-align: center; }
        th { background: #e8f5e9; color: #2c5e1a; }
        
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
        .stat-box { background: #e8f5e9; padding: 8px; border-radius: 6px; text-align: center; border-right: 4px solid #2c5e1a; }
        .stat-box h4 { margin: 0 0 3px 0; color: #555; font-size: 11px; }
        .stat-box p { margin: 0; font-size: 14px; font-weight: bold; color: #2c5e1a; }
        
        .danger-btn { background: #d9534f; color: white; border: none; padding: 3px 6px; border-radius: 3px; cursor: pointer; font-size: 11px; }
        .danger-btn:hover { background: #c9302c; }
    </style>
</head>
<body>

<div class="container">
    <!-- الشعار والعنوان في الأعلى -->
    <div class="header-section">
        <img src="logo.png" alt="شعار نجار">
        <h2>نظام تسيير وإدارة محل الزيتون والمشتقات</h2>
    </div>

    <!-- شبكة الأعمدة (كل شيء في صفحة واحدة) -->
    <div class="dashboard-grid">
        
        <!-- العمود الأيمن: المستودع والبيع -->
        <div>
            <!-- قسم المستودع المصغر -->
            <div class="card">
                <h3>📦 إدارة المستودع</h3>
                <div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px;">
                    <div class="form-group"><label>السلعة</label><input type="text" id="whName" placeholder="مثلاً: زيتون أخضر"></div>
                    <div class="form-group"><label>الكمية</label><input type="number" id="whQtyIn" value="0" min="0"></div>
                    <div class="form-group"><label>السعر (دج)</label><input type="number" id="whBuyPrice" value="0" min="0"></div>
                </div>
                <button class="action-btn" onclick="addWarehouseItem()">إضافة للمستودع</button>

                <table style="margin-top: 8px;">
                    <thead><tr><th>السلعة</th><th>دخلت</th><th>باعت</th><th>المتبقي</th><th>السعر</th><th>حذف</th></tr></thead>
                    <tbody id="warehouseTableBody"></tbody>
                </table>
            </div>

            <!-- قسم البيع المصغر -->
            <div class="card">
                <h3>💰 تسجيل المبيعات</h3>
                <div style="display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 8px;">
                    <div class="form-group"><label>اختر السلعة</label><select id="saleItemSelect"></select></div>
                    <div class="form-group"><label>الكمية</label><input type="number" id="saleQty" value="1" min="1"></div>
                    <div class="form-group"><label>سعر البيع</label><input type="number" id="salePrice" value="0" min="0"></div>
                </div>
                <button class="action-btn" onclick="makeSale()">تسجيل البيع</button>
            </div>
        </div>

        <!-- العمود الأيسر: الإحصائيات، الأرباح، وسجل المبيعات -->
        <div>
            <!-- قسم الأرباح السريعة -->
            <div class="card">
                <h3>📈 ملخص الأموال والأرباح</h3>
                <div class="stats">
                    <div class="stat-box">
                        <h4>رأس المال</h4>
                        <p id="pTotalCapital">0 دج</p>
                    </div>
                    <div class="stat-box">
                        <h4>المبيعات</h4>
                        <p id="pTotalRevenue">0 دج</p>
                    </div>
                    <div class="stat-box" style="border-right-color: #d9534f;">
                        <h4>الصافي (الربح)</h4>
                        <p id="pTotalProfit">0 دج</p>
                    </div>
                </div>
            </div>

            <!-- سجل المبيعات المصغر -->
            <div class="card">
                <h3>📋 سجل المبيعات الأخيرة</h3>
                <div style="max-height: 150px; overflow-y: auto;">
                    <table>
                        <thead><tr><th>الوقت</th><th>السلعة</th><th>الكمية</th><th>المبلغ</th><th>حذف</th></tr></thead>
                        <tbody id="salesTableBody"></tbody>
                    </table>
                </div>
            </div>

            <!-- تفصيل الأرباح لكل صنف -->
            <div class="card">
                <h3>📊 أرباح الأصناف</h3>
                <div style="max-height: 130px; overflow-y: auto;">
                    <table>
                        <thead><tr><th>السلعة</th><th>المباع</th><th>الشراء</th><th>البيع</th><th>الفائدة</th></tr></thead>
                        <tbody id="profitTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    let warehouse = JSON.parse(localStorage.getItem('olive_warehouse')) || [];
    let sales = JSON.parse(localStorage.getItem('olive_sales')) || [];

    function saveData() {
        localStorage.setItem('olive_warehouse', JSON.stringify(warehouse));
        localStorage.setItem('olive_sales', JSON.stringify(sales));
        renderAll();
    }

    function addWarehouseItem() {
        const name = document.getElementById('whName').value.trim();
        const qtyIn = parseFloat(document.getElementById('whQtyIn').value) || 0;
        const buyPrice = parseFloat(document.getElementById('whBuyPrice').value) || 0;

        if (!name) { alert('يرجى إدخال اسم السلعة'); return; }

        let existing = warehouse.find(item => item.name === name);
        if (existing) {
            existing.qtyIn += qtyIn;
            if (buyPrice > 0) existing.buyPrice = buyPrice;
        } else {
            warehouse.push({ name, qtyIn, buyPrice });
        }

        document.getElementById('whName').value = '';
        document.getElementById('whQtyIn').value = '0';
        document.getElementById('whBuyPrice').value = '0';
        saveData();
    }

    function deleteWarehouseItem(index) { warehouse.splice(index, 1); saveData(); }

    function makeSale() {
        const select = document.getElementById('saleItemSelect');
        const name = select.value;
        const qty = parseFloat(document.getElementById('saleQty').value) || 0;
        const price = parseFloat(document.getElementById('salePrice').value) || 0;

        if (!name) { alert('الرجاء اختيار سلعة'); return; }

        let item = warehouse.find(i => i.name === name);
        if (!item) { alert('السلعة غير موجودة'); return; }

        let totalSoldSoFar = sales.filter(s => s.name === name).reduce((sum, s) => sum + s.qty, 0);
        let remaining = item.qtyIn - totalSoldSoFar;

        if (qty > remaining) { alert(`المتوفر فقط: ${remaining}`); return; }

        let now = new Date().toLocaleTimeString('ar-DZ', {hour: '2-digit', minute:'2-digit'});
        sales.unshift({ time: now, name, qty, price });

        document.getElementById('saleQty').value = '1';
        document.getElementById('salePrice').value = '0';
        saveData();
    }

    function deleteSale(index) { sales.splice(index, 1); saveData(); }

    function renderAll() {
        const select = document.getElementById('saleItemSelect');
        select.innerHTML = '';
        if (warehouse.length === 0) {
            select.innerHTML = '<option value="">لا توجد سلع</option>';
        } else {
            warehouse.forEach(item => {
                let sold = sales.filter(s => s.name === item.name).reduce((sum, s) => sum + s.qty, 0);
                let rem = item.qtyIn - sold;
                select.innerHTML += `<option value="${item.name}">${item.name} (بقي: ${rem})</option>`;
            });
        }

        const whBody = document.getElementById('warehouseTableBody');
        whBody.innerHTML = '';
        warehouse.forEach((item, index) => {
            let sold = sales.filter(s => s.name === item.name).reduce((sum, s) => sum + s.qty, 0);
            let rem = item.qtyIn - sold;
            whBody.innerHTML += `
                <tr>
                    <td><b>${item.name}</b></td>
                    <td>${item.qtyIn}</td>
                    <td>${sold}</td>
                    <td style="font-weight:bold; color: ${rem > 0 ? 'green' : 'red'};">${rem}</td>
                    <td>${item.buyPrice}</td>
                    <td><button class="danger-btn" onclick="deleteWarehouseItem(${index})">حذف</button></td>
                </tr>
            `;
        });

        const salesBody = document.getElementById('salesTableBody');
        salesBody.innerHTML = '';
        sales.forEach((sale, index) => {
            let totalMoney = sale.qty * sale.price;
            salesBody.innerHTML += `
                <tr>
                    <td>${sale.time}</td>
                    <td><b>${sale.name}</b></td>
                    <td>${sale.qty}</td>
                    <td style="color: green; font-weight: bold;">${totalMoney}</td>
                    <td><button class="danger-btn" onclick="deleteSale(${index})">حذف</button></td>
                </tr>
            `;
        });

        let totalCapital = 0;
        warehouse.forEach(item => { totalCapital += (item.qtyIn * item.buyPrice); });

        let totalRevenue = 0;
        sales.forEach(sale => { totalRevenue += (sale.qty * sale.price); });

        let profitBody = document.getElementById('profitTableBody');
        profitBody.innerHTML = '';
        
        warehouse.forEach(item => {
            let itemSales = sales.filter(s => s.name === item.name);
            let totalQtySold = itemSales.reduce((sum, s) => sum + s.qty, 0);
            
            if (totalQtySold > 0) {
                let totalSellVal = itemSales.reduce((sum, s) => sum + (s.qty * s.price), 0);
                let avgSellPrice = totalSellVal / totalQtySold;
                let itemProfit = totalSellVal - (totalQtySold * item.buyPrice);

                profitBody.innerHTML += `
                    <tr>
                        <td><b>${item.name}</b></td>
                        <td>${totalQtySold}</td>
                        <td>${item.buyPrice}</td>
                        <td>${avgSellPrice.toFixed(0)}</td>
                        <td style="color: ${itemProfit >= 0 ? 'green' : 'red'}; font-weight: bold;">${itemProfit.toFixed(0)}</td>
                    </tr>
                `;
            }
        });

        if (profitBody.innerHTML === '') {
            profitBody.innerHTML = '<tr><td colspan="5">لا توجد مبيعات بعد</td></tr>';
        }

        document.getElementById('pTotalCapital').innerText = totalCapital + ' دج';
        document.getElementById('pTotalRevenue').innerText = totalRevenue + ' دج';
        
        let cogs = 0;
        sales.forEach(s => {
            let whItem = warehouse.find(i => i.name === s.name);
            if(whItem) cogs += (s.qty * whItem.buyPrice);
        });
        let exactNetProfit = totalRevenue - cogs;

        const profitEl = document.getElementById('pTotalProfit');
        profitEl.innerText = exactNetProfit + ' دج';
        profitEl.style.color = exactNetProfit >= 0 ? '#2c5e1a' : '#d9534f';
    }

    renderAll();
</script>

</body>
</html>
